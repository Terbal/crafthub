const FAQ=[["c","C'est quoi craftHUB ?","What is craftHUB?","Un atelier numérique où l'on montre ce qu'on a construit : mini-apps, scripts, automations, expériences, avec ou sans IA. Ce n'est pas un réseau social : c'est un atelier.","A digital workshop where you show what you built: mini-apps, scripts, automations, experiments, with or without AI. Not a social network: a workshop."],
["c","C'est quoi un Craft ?","What is a Craft?","Un projet que tu as construit et que tu montres : sérieux, utile, ou complètement inutile mais amusant.","A project you built and show off: serious, useful, or completely useless but fun."],
["c","À quoi servent les Flames ?","What are Flames for?","C'est notre réaction : une seule Flame par personne et par Craft. Elles montrent quels Crafts enflamment la communauté.","It's our reaction: one Flame per person per Craft. They show which Crafts set the community on fire."],
["c","Que veut dire « À la une » ?","What does “Featured” mean?","Un Craft mis en avant par l'équipe sur la page d'accueil.","A Craft highlighted by the team on the home page."],
["u","Comment publier un Craft ?","How do I publish a Craft?","Connecte-toi, ouvre le menu de ton avatar puis « Construis quelque chose ». Remplis titre, description, image, stack et IA : l'aperçu se met à jour en direct.","Log in, open your avatar menu then “Build something”. Fill in title, description, image, stack and AI: the preview updates live."],
["u","Comment modifier ou supprimer mon Craft ?","How do I edit or delete my Craft?","Sur la page du Craft : boutons Modifier et Supprimer. La suppression demande un second clic de confirmation.","On the Craft page: Edit and Delete buttons. Deleting asks for a second click to confirm."],
["u","Comment fonctionne un défi ?","How does a challenge work?","Les défis sont publiés par l'équipe. Rejoins-en un pour avoir ton tableau de bord (4 étapes), puis soumets un de tes Crafts. Les Crafts soumis apparaissent dans la galerie du défi. Tu peux aussi proposer un défi.","Challenges are published by the team. Join one to get your dashboard (4 steps), then submit one of your Crafts. Submitted Crafts appear in the challenge gallery. You can also suggest a challenge."],
["u","Comment répondre à un message précis dans Discussions ?","How do I reply to a specific message in Discussions?","Clique sur « Répondre » sous le message : ta réponse citera ce message. L'auteur du post est reconnaissable à son badge et à ses bulles colorées.","Click “Reply” under the message: your answer will quote it. The post author is recognizable by a badge and colored bubbles."],
["u","Comment écrire un article ?","How do I write an article?","Sur la page Blog, propose ton article. L'équipe le relit puis le publie : le blog reste éditorial et de qualité.","On the Blog page, suggest your article. The team reviews then publishes it: the blog stays editorial and high quality."],
["u","Comment changer la langue ou le thème ?","How do I change language or theme?","Boutons FR/EN et ◐ en haut à droite. Le contenu écrit par les membres n'est pas traduit.","FR/EN and ◐ buttons at the top right. Member-written content is not translated."],
["w","Quand publier mon Craft ?","When should I publish my Craft?","Dès qu'il fonctionne, même imparfait. Mieux vaut un projet montré que dix projets parfaits cachés.","As soon as it works, even if rough. One shown project beats ten perfect hidden ones."],
["w","Quand utiliser Vibe Check ?","When should I use Vibe Check?","Quand tu as construit quelque chose mais que tu n'es pas prêt à le montrer, ou que tu es bloqué. Le message va à l'équipe, pas de messagerie privée.","When you built something but aren't ready to show it, or you're stuck. The message goes to the team; no private messaging."],
["w","Discussions ou Vibe Check ?","Discussions or Vibe Check?","Discussions : public, pour la communauté. Vibe Check : pour l'équipe seulement.","Discussions: public, for the community. Vibe Check: for the team only."],
["i","Je ne vois pas mon Craft","I can't see my Craft","Vérifie la recherche et les filtres de la page Crafts, ou ouvre Mes Crafts dans le menu de ton avatar.","Check the search and filters on the Crafts page, or open My Crafts from your avatar menu."],
["i","Mon image est refusée","My image is rejected","Formats PNG, JPG ou WebP, 5 Mo maximum. Elle est redimensionnée automatiquement.","PNG, JPG or WebP, 5 MB max. It's resized automatically."],
["i","Un contenu me pose problème","A piece of content bothers me","Utilise le bouton Signaler, choisis un motif : l'équipe reçoit le signalement et l'examine.","Use the Report button and pick a reason: the team receives and reviews it."],
["i","Mon compte est suspendu","My account is suspended","Écris-nous via la page Contact en expliquant la situation.","Write to us via the Contact page and explain the situation."],
["i","J'ai oublié mon mot de passe","I forgot my password","Dans cette démo locale il n'y a pas de récupération : crée un nouveau compte. En production, la réinitialisation se fera par e-mail.","This local demo has no recovery: create a new account. In production, reset will work by email."],
["i","Où sont mes données ?","Where is my data?","Dans cette démo, elles restent dans ton navigateur et ne se partagent pas entre appareils. En production, elles seront sur Firebase.","In this demo, it stays in your browser and is not shared across devices. In production it will live on Firebase."]];
